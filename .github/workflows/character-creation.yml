name: Character creation browser checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Serve actual creation screen with canonical game modules
        run: |
          mkdir -p /tmp/ngw-preview/nexgameworld
          cp -r planet-test /tmp/ngw-preview/nexgameworld/
          cp *.js /tmp/ngw-preview/nexgameworld/
          cp portal/account.html portal/account.js /tmp/ngw-preview/nexgameworld/
          python3 -m http.server 8765 --directory /tmp/ngw-preview > /tmp/ngw-http.log 2>&1 &
      - run: node ops/character-creation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-creation-screenshots
          path: artifacts/
