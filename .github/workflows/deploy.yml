name: NGW VPS deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'server/**'
      - 'planet-test/**'
      - 'bestiary/**'
      - '*.js'
      - 'package.json'
permissions:
  contents: read
concurrency:
  group: ngw-vps-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE: deploy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and release before reaching VPS
        run: |
          set -euo pipefail
          npm install --prefix server --ignore-scripts --no-audit --no-fund
          npm run check --prefix server
          npm test --prefix server
          node --test ops/audit-production.test.mjs
          # Only tracked runtime source/data: never package credentials or node_modules.
          git ls-files -z | python3 -c 'import sys; paths=sys.stdin.buffer.read().split(b"\0"); sys.stdout.buffer.write(b"\0".join(p for p in paths if p and p.endswith((b".js",b".mjs",b".json",b".sql")) and not p.startswith((b".github/",b"ops/",b"versions/")))+b"\0")' > /tmp/ngw-files
          tar --null -T /tmp/ngw-files -czf /tmp/ngw-release.tgz
      - name: Configure SSH with pinned VPS host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '94.103.87.93 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbWFAA2zL+WsOnYqQra1JpNSDboVf1ubAOhr4qSQhQH' > ~/.ssh/known_hosts
      - name: Upload and validate isolated complete release
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          "${SSH[@]}" ngw-deploy@94.103.87.93 "set -eu; umask 077; mkdir /opt/nexgameworld/releases/$RELEASE"
          cat /tmp/ngw-release.tgz | "${SSH[@]}" ngw-deploy@94.103.87.93 "tar -xzf - -C /opt/nexgameworld/releases/$RELEASE"
          "${SSH[@]}" ngw-deploy@94.103.87.93 "bash -s -- '$RELEASE' '${{ github.sha }}'" <<'REMOTE'
          set -euo pipefail
          cd "/opt/nexgameworld/releases/$1/server"
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          node --check index.js
          node --input-type=module -e 'await import("./spherical-world.js"); console.log("SERVER_IMPORT_GRAPH_OK")'
          printf '%s\n' "$2" > .source-commit
          test -s /opt/nexgameworld/shared/server.env
          sudo -n -l /usr/bin/systemctl restart nexgameworld.service >/dev/null
          # Existing database credentials and feature flags remain in the private file.
          # Pin the game to loopback; the existing proxy terminates TLS/WSS.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/opt/nexgameworld/shared/server.env')
          lines=[s for s in p.read_text().splitlines() if not s.startswith(('HOST=','PORT='))]
          assert any(s.startswith('DATABASE_URL=') for s in lines), 'Database configuration missing'
          p.write_text('\n'.join(lines+['HOST=127.0.0.1','PORT=9800'])+'\n')
          p.chmod(0o600)
          PY
          node --input-type=module <<'JS'
          import pg from 'pg';
          import {readFileSync} from 'node:fs';
          const value=readFileSync('/opt/nexgameworld/shared/server.env','utf8').split(/\r?\n/).find(s=>s.startsWith('DATABASE_URL='))?.slice(13).trim();
          const pool=new pg.Pool({connectionString:value,connectionTimeoutMillis:10000,max:1});
          try { await pool.query('SELECT 1'); console.log('DATABASE_CONNECTION_OK'); }
          catch(e) { console.error('DATABASE_CONNECTION_FAILED',e.code||e.name); process.exitCode=1; }
          finally { await pool.end(); }
          JS
          REMOTE
      - name: Activate release with rollback and public API checks
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 ngw-deploy@94.103.87.93 "bash -s -- '$RELEASE'" <<'REMOTE'
          set -euo pipefail
          base=/opt/nexgameworld
          test -L "$base/current"
          previous=$(readlink -f "$base/current")
          next="$base/releases/$1/server"
          expected=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('$base/releases/$1/planet-test/version.json')).version)")
          rollback() {
            echo ROLLING_BACK_GAME_ONLY
            ln -sfn "$previous" "$base/.current-rollback"
            mv -Tf "$base/.current-rollback" "$base/current"
            sudo -n systemctl restart nexgameworld.service
          }
          trap 'rollback' ERR
          ln -sfn "$next" "$base/.current-next"
          mv -Tf "$base/.current-next" "$base/current"
          sudo -n systemctl restart nexgameworld.service
          ready=false
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:9800/ready >/dev/null; then ready=true; break; fi
            sleep 3
          done
          test "$ready" = true
          EXPECTED="$expected" node --input-type=module <<'JS'
          for(const origin of ['http://127.0.0.1:9800','https://api.nexions.ru']) {
            const get=async path=>{
              const r=await fetch(origin+path,{signal:AbortSignal.timeout(15000)});
              if(!r.ok)throw Error(path+' HTTP '+r.status);
              return r.json();
            };
            const [h,r]=await Promise.all([get('/health'),get('/ready')]);
            if(!h.ok||!r.ready||h.build!==process.env.EXPECTED||r.build!==h.build||
              h.accountDbStatus!=='ready'||!h.accountApiEnabled||!h.authenticatedWorldEnabled||
              !h.authenticatedEconomyEnabled||h.guestWorldEnabled!==false||
              h.worldMetrics.progressSaveFailures!==0)throw Error('Game readiness contract failed');
            console.log('VERIFIED',origin,h.build,'players='+h.players);
          }
          JS
          # Prove TLS WebSocket upgrade without creating an account or changing player data.
          cd "$next"
          node --input-type=module <<'JS'
          import WebSocket from 'ws';
          await new Promise((resolve,reject)=>{
            const ws=new WebSocket('wss://api.nexions.ru/ws/nexgameworld/auth',{origin:'https://nexions.ru'});
            const timer=setTimeout(()=>{ws.terminate();reject(Error('WSS timeout'));},10000);
            ws.once('error',reject);
            ws.once('open',()=>{clearTimeout(timer); ws.close(); resolve();});
          });
          console.log('PUBLIC_WSS_OK');
          JS
          trap - ERR
          echo VPS_RELEASE_VERIFIED
          REMOTE
      - name: Read game service state
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 ngw-deploy@94.103.87.93 'systemctl show nexgameworld.service -p ActiveState -p SubState -p NRestarts -p ExecMainStatus; printf "HEALTH="; curl -s -o /dev/null -w "%{http_code}\n" --max-time 5 http://127.0.0.1:9800/health; printf "READY="; curl -s -o /dev/null -w "%{http_code}\n" --max-time 5 http://127.0.0.1:9800/ready'
