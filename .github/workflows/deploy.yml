name: NGW VPS deploy (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ngw-vps-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '94.103.87.93 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbWFAA2zL+WsOnYqQra1JpNSDboVf1ubAOhr4qSQhQH' > ~/.ssh/known_hosts
      - name: Validate release
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'test -f /opt/nexgameworld/current/index.js && node --check /opt/nexgameworld/current/index.js && echo RELEASE_VALID'
      - name: Verify scoped service rights
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'sudo -n -l /usr/bin/systemctl restart nexgameworld.service >/dev/null && echo SERVICE_RIGHTS_OK'
      - name: Configure database connection on VPS
        env:
          NGW_VPS_DATABASE_URL: ${{ secrets.NGW_VPS_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NGW_VPS_DATABASE_URL"
          printf 'DATABASE_URL=%s\n' "$NGW_VPS_DATABASE_URL" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'umask 077; cat > /opt/nexgameworld/shared/server.env; chmod 600 /opt/nexgameworld/shared/server.env'
      - name: Verify database connectivity without starting game server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'set -eu; test -s /opt/nexgameworld/shared/server.env; test -d /opt/nexgameworld/current/node_modules/pg; cd /opt/nexgameworld/current; set -a; . /opt/nexgameworld/shared/server.env; set +a; node --input-type=module -e '"'"'import pg from "pg"; const pool = new pg.Pool({connectionString:process.env.DATABASE_URL,connectionTimeoutMillis:8000,max:1}); try { const r=await pool.query("select 1 as ok"); if(r.rows[0].ok!==1) throw Error("Unexpected database result"); console.log("NEON_CONNECTION_OK"); } finally { await pool.end(); }'"'"''
      - name: Report
        run: echo 'Preflight completed. No production service was started or restarted.'
