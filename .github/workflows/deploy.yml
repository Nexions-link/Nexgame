name: NGW VPS deploy (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy.yml']
permissions:
  contents: write
concurrency:
  group: ngw-vps-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '94.103.87.93 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbWFAA2zL+WsOnYqQra1JpNSDboVf1ubAOhr4qSQhQH' > ~/.ssh/known_hosts
      - name: Validate release
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'test -f /opt/nexgameworld/current/index.js && node --check /opt/nexgameworld/current/index.js && echo RELEASE_VALID'
      - name: Verify scoped service rights
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'sudo -n -l /usr/bin/systemctl restart nexgameworld.service >/dev/null && echo SERVICE_RIGHTS_OK'
      - name: Validate database secret format
        env:
          NGW_VPS_DATABASE_URL: ${{ secrets.NGW_VPS_DATABASE_URL }}
        run: |
          node -e 'const s=process.env.NGW_VPS_DATABASE_URL||""; let u; try { u=new URL(s); } catch { console.error("DATABASE_URL_INVALID"); process.exit(1); } if(!["postgres:","postgresql:"].includes(u.protocol)||!u.hostname||["localhost","127.0.0.1","::1"].includes(u.hostname)||!u.username||!u.password){ console.error("DATABASE_URL_INVALID_OR_LOCAL"); process.exit(1); } console.log("DATABASE_URL_REMOTE_FORMAT_OK");'
      - name: Configure database connection on VPS
        env:
          NGW_VPS_DATABASE_URL: ${{ secrets.NGW_VPS_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NGW_VPS_DATABASE_URL"
          printf 'DATABASE_URL=%s\nNGW_ACCOUNTS_ENABLED=true\nNGW_AUTH_WORLD_ENABLED=true\nNGW_ECONOMY_ENABLED=true\nNGW_CHEST_DATA_FILE=/opt/nexgameworld/shared/chest.json\n' "$NGW_VPS_DATABASE_URL" | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'umask 077; cat > /opt/nexgameworld/shared/server.env; chmod 600 /opt/nexgameworld/shared/server.env'
      - name: Verify database connectivity without starting game server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'cd /opt/nexgameworld/current && node --input-type=module -e '"'"'import pg from "pg"; import {readFileSync} from "node:fs"; const data=readFileSync("/opt/nexgameworld/shared/server.env","utf8"); const line=data.split(/\r?\n/).find(s=>s.startsWith("DATABASE_URL=")); const value=line?.slice("DATABASE_URL=".length).trim(); let url; try{url=new URL(value);}catch{console.error("VPS_DATABASE_URL_INVALID");process.exit(1);} if(!["postgres:","postgresql:"].includes(url.protocol)||["localhost","127.0.0.1","::1"].includes(url.hostname)||!url.password){console.error("VPS_DATABASE_URL_INVALID_OR_LOCAL");process.exit(1);} const pool=new pg.Pool({connectionString:value,connectionTimeoutMillis:8000,max:1}); try{const r=await pool.query("select 1 as ok"); if(r.rows[0].ok!==1)throw Error("Unexpected database result");console.log("NEON_CONNECTION_OK");}catch(e){console.error("NEON_CONNECTION_FAILED",e.code||e.name);process.exitCode=1;}finally{await pool.end();}'"'"''
      - name: Activate game service
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'sudo -n systemctl restart nexgameworld.service'
      - name: Verify live game service
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'set -eu; for i in 1 2 3 4 5 6 7 8; do if curl --fail --silent --max-time 4 http://127.0.0.1:9800/ready >/dev/null; then echo NGW_READY_OK; curl --fail --silent --show-error http://127.0.0.1:9800/health; exit 0; fi; sleep 3; done; echo NGW_NOT_READY; exit 1'
      - name: Diagnose VPS gateway and service
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'echo SERVICE_STATE; systemctl is-active nexgameworld.service || true; echo PORT_9800; ss -ltn | grep ":9800 " || true; echo LOCAL_HEALTH; curl -sS -i --max-time 5 http://127.0.0.1:9800/health || true; echo PUBLIC_HEALTH; curl -sS -i --max-time 7 https://api.nexions.ru/health || true; echo SERVICE_STATUS; systemctl status nexgameworld.service --no-pager --lines=15 || true'
      - name: Publish sanitized VPS diagnostic to repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes ngw-deploy@94.103.87.93 'printf "SERVICE="; systemctl is-active nexgameworld.service || true; printf "LOCAL_HEALTH="; curl -s -o /dev/null -w "%{http_code}" --max-time 4 http://127.0.0.1:9800/health; printf "\\nLOCAL_READY="; curl -s -o /dev/null -w "%{http_code}" --max-time 4 http://127.0.0.1:9800/ready; printf "\\n"' > ngw-vps-status.txt 2>&1
          printf 'PUBLIC_HEALTH=' >> ngw-vps-status.txt
          curl -s -o /dev/null -w '%{http_code}' --max-time 7 https://api.nexions.ru/health >> ngw-vps-status.txt
          printf '\\n' >> ngw-vps-status.txt
          gh api --method PUT repos/${{ github.repository }}/contents/ops/vps/latest-status.txt -f message="ops: publish VPS health result" -f content="$(base64 -w0 ngw-vps-status.txt)" -f branch=main --jq '.content.path' || true
      - name: Report
        run: echo 'Game service activation requested.'
