name: NexGame Online CI

# A release is published by changing app.html LAST, after game.js/imports/style.css.
# Do not test half-written multi-file releases after each individual file update.
on:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'bestiary/**'
      - 'tests/bestiary.test.mjs'
      - 'server/**'
      - '.github/workflows/nexgame-online.yml'
  pull_request:
    paths:
      - 'game.js'
      - 'bestiary/**'
      - 'tests/bestiary.test.mjs'
      - 'movement-controls.js'
      - 'tests/movement-controls.test.mjs'
      - 'meadow.js'
      - 'lake.js'
      - 'tests/lake.test.mjs'
      - 'landscape.js'
      - 'tests/meadow.test.mjs'
      - 'chest-ui.js'
      - 'building-physics.js'
      - 'tests/buildings.test.mjs'
      - 'index.html'
      - 'app.html'
      - 'tests/bootstrap.test.mjs'
      - 'style.css'
      - 'tests/hud-layout.test.mjs'
      - 'online.js'
      - 'online-config.js'
      - 'party-map.js'
      - 'tests/party-map.test.mjs'
      - 'tests/online-population.test.mjs'
      - 'server/**'
      - 'items.js'
      - '.github/workflows/nexgame-online.yml'
  workflow_dispatch:

# Only the newest push to a branch needs a full check. In-progress obsolete
# releases are cancelled instead of reporting spurious failures to the user.
concurrency:
  group: nexgame-online-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-world:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check client and server
        run: |
          node --check game.js
          node --check bestiary/main.js
          node --check bestiary/dolgonog.js
          node --check bestiary/catalog.js
          node --check tests/bestiary.test.mjs
          node --check movement-controls.js
          node --check tests/movement-controls.test.mjs
          node --check meadow.js
          node --check lake.js
          node --check tests/lake.test.mjs
          node --check landscape.js
          node --check tests/meadow.test.mjs
          node --check chest-ui.js
          node --check building-physics.js
          node --check tests/buildings.test.mjs
          node --check online.js
          node --check online-config.js
          node --check party-map.js
          node --check tests/party-map.test.mjs
          node --check tests/hud-layout.test.mjs
          node --check tests/bootstrap.test.mjs
          node --check tests/online-population.test.mjs
          npm run check --prefix server
      - name: Install only server dependencies
        run: npm install --prefix server --no-audit --no-fund
      - name: Test private chat, party map, PvE and real WebSocket sessions
        run: |
          node --test tests/party-map.test.mjs tests/hud-layout.test.mjs tests/bootstrap.test.mjs tests/online-population.test.mjs tests/buildings.test.mjs tests/meadow.test.mjs tests/lake.test.mjs tests/movement-controls.test.mjs tests/bestiary.test.mjs
          npm test --prefix server
