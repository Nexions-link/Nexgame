name: NexGameWorld Spherical and Server CI

on:
  push:
    branches: [main]
    paths:
      - 'planet-test/**'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'app.html'
      - 'bestiary/**'
      - 'assets/**'
      - 'server/**'
      - 'ops/**'
      - 'package.json'
      - '.github/workflows/nexgame-online.yml'
  pull_request:
    paths:
      - 'planet-test/**'
      - '*.js'
      - '*.css'
      - 'bestiary/**'
      - 'assets/**'
      - 'server/**'
      - 'ops/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexgame-active-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spherical-client:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install client test dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check active spherical game
        run: npm run check
      - name: Run spherical gameplay and visual regressions
        run: npm test
      - name: Verify production watchdog logic without live requests
        run: node --test ops/audit-production.test.mjs

  multiplayer-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --prefix server --no-audit --no-fund
      - name: Server tests
        run: npm test --prefix server
