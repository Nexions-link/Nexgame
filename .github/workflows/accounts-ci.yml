name: NexGameWorld Accounts 0.7 CI
on:
  push:
    branches:
      - feature/ngw-accounts-0.7.0
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  accounts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check server syntax
        run: npm run check
      - name: Check account and character APIs
        run: npm run test:accounts
      - name: Regression tests for multiplayer and combat
        run: npm test
