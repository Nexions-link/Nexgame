name: NGW VPS S-05 infrastructure preflight
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Configure pinned SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '94.103.87.93 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbWFAA2zL+WsOnYqQra1JpNSDboVf1ubAOhr4qSQhQH' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only VPS infrastructure audit
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 ngw-deploy@94.103.87.93 'set -eu
            echo "== identity =="; id -un
            echo "== runtime =="; node --version; npm --version
            echo "== storage =="; df -h /opt/nexgameworld; du -sh /opt/nexgameworld/releases
            echo "== memory =="; free -m
            echo "== listening TCP ports =="; (ss -ltn || true)
            echo "== reverse proxy tools =="; command -v caddy || true; command -v nginx || true
            echo "== systemd user bus =="; (systemctl --user is-system-running || true)
            echo "== service state =="; (systemctl is-active nexgameworld || true)
            echo "== stage dirs =="; find /opt/nexgameworld/releases -mindepth 1 -maxdepth 1 -type d -printf "%f\n"
            echo "== private env present? =="; if test -f /opt/nexgameworld/shared/server.env; then echo YES; else echo NO; fi
            echo "== port 9800 occupied? =="; if ss -ltn | grep -Eq "[:.]9800[[:space:]]"; then echo YES; else echo NO; fi
          '
