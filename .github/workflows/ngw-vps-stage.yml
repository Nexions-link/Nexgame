name: NGW VPS S-04 stage server files
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ngw-vps-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Configure SSH with pinned host key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '94.103.87.93 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbWFAA2zL+WsOnYqQra1JpNSDboVf1ubAOhr4qSQhQH' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Check server source before upload
        run: |
          test -f server/index.js
          test -f server/package.json
          node --check server/index.js
      - name: Upload isolated release (no service start)
        env:
          RELEASE: staging-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          REMOTE="ngw-deploy@94.103.87.93"
          "${SSH[@]}" "$REMOTE" "set -eu; umask 077; test -d /opt/nexgameworld/releases; test ! -e /opt/nexgameworld/releases/$RELEASE; mkdir /opt/nexgameworld/releases/$RELEASE"
          tar -C server --exclude=node_modules --exclude='.env' --exclude='.env.*' --exclude='*.pem' --exclude='*.key' -czf - . | "${SSH[@]}" "$REMOTE" "tar -xzf - -C /opt/nexgameworld/releases/$RELEASE"
          "${SSH[@]}" "$REMOTE" "set -eu; cd /opt/nexgameworld/releases/$RELEASE; npm install --omit=dev --ignore-scripts --no-audit --no-fund; node --check index.js; test -d node_modules/pg; test -d node_modules/ws; printf '%s\n' '${{ github.sha }}' > .source-commit; echo STAGING_OK:$RELEASE"
      - name: Select validated release symlink (no server start)
        env:
          RELEASE: staging-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 ngw-deploy@94.103.87.93 "bash -s -- '$RELEASE'" < ops/vps/select-release.sh
          echo "CURRENT_LINK_UPDATED:$RELEASE"
      - name: Read-only VPS infrastructure preflight
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 ngw-deploy@94.103.87.93 'set -eu
            echo "== identity =="; id -un
            echo "== runtime =="; node --version; npm --version
            echo "== disk =="; df -h /opt/nexgameworld; du -sh /opt/nexgameworld/releases
            echo "== memory =="; free -m
            echo "== TCP listeners =="; (ss -ltn || true)
            echo "== reverse proxy =="; command -v caddy || true; command -v nginx || true
            echo "== systemd user bus =="; (systemctl --user is-system-running || true)
            echo "== service state =="; (systemctl is-active nexgameworld || true)
            echo "== private env present =="; if test -f /opt/nexgameworld/shared/server.env; then echo YES; else echo NO; fi
            echo "== 9800 in use =="; if ss -ltn | grep -Eq ":9800[[:space:]]"; then echo YES; else echo NO; fi
          '
      - name: S-08 verify VPS readiness without starting Node
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 ngw-deploy@94.103.87.93 'set -eu
            echo "== release link =="; if test -L /opt/nexgameworld/current; then readlink -f /opt/nexgameworld/current; else echo MISSING; fi
            echo "== Node files =="; if test -f /opt/nexgameworld/current/index.js; then node --check /opt/nexgameworld/current/index.js && echo OK; else echo MISSING; fi
            echo "== private environment =="; if test -s /opt/nexgameworld/shared/server.env; then echo PRESENT_NONEMPTY; else echo MISSING_OR_EMPTY; fi
            echo "== service enabled =="; (systemctl is-enabled nexgameworld || true)
            echo "== service active =="; (systemctl is-active nexgameworld || true)
            echo "== proxy TLS =="; (curl -sS -o /dev/null -w "HTTP_%{http_code}\n" --connect-timeout 5 --max-time 12 https://api.nexions.ru/ || true)
            echo "== service port =="; if ss -ltn | grep -Eq ":9800[[:space:]]"; then echo IN_USE; else echo FREE; fi
          '
      - name: Explain next steps
        run: |
          echo 'Staging uploaded and syntax/dependency checks passed.'
          echo 'Current symlink now selects the validated release. No systemd unit was started or changed. No Neon database connection attempted.'
          echo 'Render and TeamSpeak remain untouched.'
