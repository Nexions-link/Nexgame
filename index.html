stick.addEventListener("pointermove",e=>{if(e.pointerId===joy.id){e.preventDefault();stickMove(e)}});

renderer.domElement.style.touchAction="none";
renderer.domElement.addEventListener("pointerdown",e=>{if(paused||dialog||look.id!==null||e.clientX<innerWidth*.35)return;look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener("pointermove",e=>{if(e.pointerId!==look.id)return;const dx=e.clientX-look.x,dy=e.clientY-look.y;look.x=e.clientX;look.y=e.clientY;cameraYaw-=dx*.008;cameraPitch=THREE.MathUtils.clamp(cameraPitch+dy*.005,.13,1.08)});
for(const name of ["pointerup","pointercancel","lostpointercapture"])renderer.domElement.addEventListener(name,e=>{if(e.pointerId===look.id)look.id=null});
renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("wheel",e=>{cameraDistance=THREE.MathUtils.clamp(cameraDistance+Math.sign(e.deltaY)*.55,5.5,12)},{passive:true});
addEventListener("blur",clearInput);
addEventListener("keydown",e=>{const key=e.key.toLowerCase();if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key))e.preventDefault();
 if(key==="escape"){if(dialog)closeDialog();else togglePause();return}
 if(key===" "){if(!e.repeat)attack();return}
 if(key==="e"){if(!e.repeat)interact();return}
 if(key==="i"){if(!e.repeat)bag();return}
 keys.add(key)});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function msg(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1900)}
function xpNeed(){return 100+(state.level-1)*45}
function experience(n){state.xp+=n;while(state.xp>=xpNeed()){state.xp-=xpNeed();state.level++;state.hp=100+(state.level-1)*15;msg("Новый уровень: "+state.level+"!")}}
function hud(){
 const max=100+(state.level-1)*15;
 $("lvl").textContent=state.level;$("hp").textContent=Math.ceil(state.hp);$("maxHp").textContent=max;
 $("xp").textContent=state.xp;$("need").textContent=xpNeed();$("gold").textContent=state.gold;$("potions").textContent=state.potions;
 $("hpFill").style.width=Math.max(0,100*state.hp/max)+"%";$("xpFill").style.width=100*state.xp/xpNeed()+"%";
 const quests=[
 ["Начало пути","Поговорите со старостой Эйрин в деревне."],
 ["Волки у дороги","Победите волков за деревней: "+state.kills+"/3"],
 ["Волки у дороги","Вернитесь к старосте за наградой."],
 ["Новое задание","Поговорите со старостой Эйрин."],
 ["Старая печать","Найдите печать на алтаре к востоку."],
 ["Старая печать","Отнесите печать старосте Эйрин."],
 ["Долина ждёт","Исследуйте мир. Продолжение следует."]
 ];
 $("qtitle").textContent=quests[state.quest][0];$("qtext").textContent=quests[state.quest][1];
 $("area").textContent=Math.hypot(state.x,state.z)<14?"✧ Деревня Тихий Приют":"✧ Сумеречная долина";
 updateMarker(state.quest);
 const target=nearTarget();$("interact").style.display=!paused&&!dialog&&target?"block":"none";
 if(target)$("interact").innerHTML=target.kind==="relic"?"✦<br>Взять":"✦<br>Говорить";
 relicCrystal.visible=state.quest===4&&!state.relic;
}
function openDialog(title,sub,lines){clearInput();dialog=true;$("mtitle").textContent=title;$("msub").textContent=sub;$("mbody").replaceChildren();$("actions").replaceChildren();
 for(const t of lines){const p=document.createElement("p");p.textContent=t;$("mbody").appendChild(p)}$("modal").classList.add("show")}
function choice(text,action,type=""){const b=document.createElement("button");b.className="choice "+type;b.textContent=text;b.addEventListener("click",action);$("actions").appendChild(b)}
function closeDialog(){dialog=false;$("modal").classList.remove("show");save();hud()}
function nearTarget(){const dist=(x,z)=>Math.hypot(state.x-x,state.z-z);
 for(const n of npc)if(dist(n.x,n.z)<2.8)return{kind:"npc",npc:n};
 if(state.quest===4&&!state.relic&&dist(15,17)<2.9)return{kind:"relic"};
 return null}
function interact(){
 if(paused||dialog)return;
 const target=nearTarget();if(!target){msg("Подойдите ближе к NPC или предмету");return}
 if(target.kind==="relic"){state.relic=true;state.quest=5;msg("Получена древняя печать");hud();save();return}
 if(target.npc.type==="elder")elderTalk();else merchantTalk();
}
function elderTalk(){
 const q=state.quest;
 if(q===0){openDialog("Староста Эйрин","Деревня Тихий Приют · Задание",["Странник, за дорогой появились дикие волки. Помоги защитить жителей!","Победи трёх волков за пределами деревни."]);
 choice("Принять: Волки у дороги",()=>{state.quest=1;state.kills=0;closeDialog();msg("Задание принято!")});choice("Позже",closeDialog,"alt")}
 else if(q===1){openDialog("Староста Эйрин","Волки у дороги",["Нам всё ещё нужна помощь. Волков побеждено: "+state.kills+" из 3."]);choice("Продолжить",closeDialog)}
 else if(q===2){openDialog("Староста Эйрин","Задание выполнено",["Ты очистил дорогу. Прими награду!"]);choice("Получить 25 золотых и 80 опыта",()=>{state.quest=3;state.gold+=25;experience(80);closeDialog();msg("Задание выполнено!")})}
 else if(q===3){openDialog("Староста Эйрин","Новое задание",["На востоке долины стоит забытый алтарь. Найди там старую магическую печать."]);choice("Принять: Старая печать",()=>{state.quest=4;closeDialog();msg("Новое задание!")});choice("Позже",closeDialog,"alt")}
 else if(q===4){openDialog("Староста Эйрин","Старая печать",["Ищи алтарь к востоку от деревни. На нём лежит светящийся предмет."]);choice("Хорошо",closeDialog)}
 else if(q===5){openDialog("Староста Эйрин","Задание выполнено",["Ты нашёл древнюю печать! Это только начало исследований."]);choice("Отдать печать: 40 золотых и 110 опыта",()=>{state.quest=6;state.relic=false;state.gold+=40;experience(110);closeDialog();msg("Задание выполнено!")})}
 else{openDialog("Староста Эйрин","Тихий Приют",["Спасибо за помощь, странник. Скоро в долине появятся новые приключения."]);choice("До встречи",closeDialog)}
}
function merchantTalk(){openDialog("Торговка Мира","Лавка у дороги",["Лечебный настой стоит 10 золотых. У тебя "+state.gold+" золотых."]);
 choice("Купить зелье — 10 золотых",()=>{if(state.gold<10){msg("Недостаточно золота");return}state.gold-=10;state.potions++;closeDialog();msg("Зелье куплено")});choice("Закрыть",closeDialog,"alt")}
function bag(){if(paused)return;if(dialog){closeDialog();return}
 openDialog("Рюкзак странника","Предметы и снаряжение · "+state.gold+" золотых",["Потёртый меч — начальное оружие.","Доспех странника — лёгкая броня.",state.relic?"Древняя печать — предмет задания.":"Свободное место для находок."]);
 choice("🧪 Выпить зелье лечения × "+state.potions,()=>{if(state.potions===0){msg("Нет зелий");return}if(state.hp>=100+(state.level-1)*15){msg("Здоровье уже полное");return}state.hp=Math.min(100+(state.level-1)*15,state.hp+40);state.potions--;closeDialog();msg("Здоровье восстановлено")});
 choice("Закрыть",closeDialog,"alt")}
function attack(){
 if(paused||dialog||cooldown>0)return;
 attackTimer=.36;cooldown=.55;
 let best=null,dist=2.35;
 for(const e of enemies){if(e.dead>0)continue;const d=Math.hypot(state.x-e.mesh.position.x,state.z-e.mesh.position.z);if(d<dist){best=e;dist=d}}
 if(best){
  best.hp-=24;best.hit=.17;
  if(best.hp<=0){
   best.dead=22;best.mesh.visible=false;best.hp=0;state.gold+=3;experience(18);
   if(state.quest===1){state.kills=Math.min(3,state.kills+1);if(state.kills===3){state.quest=2;msg("Волки побеждены! Вернись к Эйрин")}}
   save();
  }
 }
}
$("attack").addEventListener("pointerdown",e=>{e.preventDefault();attack()});
$("interact").addEventListener("click",interact);$("bag").addEventListener("click",bag);
function togglePause(){
 if(dialog)return;paused=!paused;clearInput();
 if(paused){
  openDialog("Пауза","NexGame 3D · тестовая версия",["Мир остановлен. Можно продолжить или сбросить весь прогресс в 3D-прототипе."]);
  choice("▶ Продолжить",()=>{closeDialog();paused=false});
  choice("↻ Сбросить 3D-прогресс",()=>{openDialog("Начать сначала?","Подтверждение сброса",["Будут сброшены уровень, задания, золото, предметы и состояние врагов. Архивная 2.5D-игра не изменится."]);
    choice("Да, сбросить",resetWorld,"danger");choice("Отмена",()=>{closeDialog();paused=false},"alt")},"danger");
 }else{$("modal").classList.remove("show");dialog=false}
 $("pause").textContent=paused?"▶ Пауза":"⏸ Пауза";
}
function resetWorld(){
 state={...initial};cooldown=0;attackTimer=0;animT=0;stepSmooth=0;
 for(const e of enemies){e.dead=0;e.hit=0;e.hp=48;e.mesh.visible=true;e.mesh.position.set(e.spawnX,0,e.spawnZ)}
 hero.root.position.set(state.x,0,state.z);hero.root.rotation.y=state.yaw;
 cameraYaw=0;cameraPitch=.37;clearInput();paused=false;closeDialog();$("pause").textContent="⏸ Пауза";hud();save();msg("3D-мир сброшен!")
}
$("pause").addEventListener("click",()=>{if(!paused&&dialog)return;if(paused){closeDialog();paused=false;$("pause").textContent="⏸ Пауза"}else togglePause()});
function approachMovement(dt){
 const axisX=joy.x+Number(keys.has("d")||keys.has("arrowright"))-Number(keys.has("a")||keys.has("arrowleft"));
 const axisZ=joy.y+Number(keys.has("s")||keys.has("arrowdown"))-Number(keys.has("w")||keys.has("arrowup"));
 const n=Math.hypot(axisX,axisZ),scale=n>1?1/n:1;
 const fx=axisX*scale,fy=axisZ*scale;
 const power=Math.min(n,1);
 let moved=false;
 if(power>.05){
  const right=new THREE.Vector3(Math.cos(cameraYaw),0,-Math.sin(cameraYaw));
  const forward=new THREE.Vector3(-Math.sin(cameraYaw),0,-Math.cos(cameraYaw));
  const dir=new THREE.Vector3().addScaledVector(right,fx).addScaledVector(forward,-fy).normalize();
  const dx=dir.x*4.25*dt*power,dz=dir.z*4.25*dt*power;
  if(clearAt(state.x+dx,state.z+dz)){state.x+=dx;state.z+=dz;moved=true}
  else if(clearAt(state.x+dx,state.z)){state.x+=dx;moved=true}
  else if(clearAt(state.x,state.z+dz)){state.z+=dz;moved=true}
  if(moved){
   const targetYaw=Math.atan2(dir.x,dir.z);
   let da=((targetYaw-hero.root.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;
   hero.root.rotation.y+=da*Math.min(1,dt*12);
   state.yaw=hero.root.rotation.y;
  }
 }
 stepSmooth=THREE.MathUtils.damp(stepSmooth,moved?power:0,9,dt);
 animT+=dt*(stepSmooth>.1?10.5:2);
 const step=Math.sin(animT)*stepSmooth;
 hero.legs[0].rotation.x=step*.52;hero.legs[1].rotation.x=-step*.52;
 hero.arms[0].rotation.x=-step*.35;
 hero.arms[1].rotation.x=attackTimer>0?-1.5+Math.sin((1-attackTimer/.36)*Math.PI)*1.8:step*.25;
 hero.hip.position.y=.018*Math.sin(animT)*stepSmooth;
 cape.rotation.x=-.2-stepSmooth*.19;
 hero.root.position.set(state.x,0,state.z);
}
const camFocus=new THREE.Vector3(),camPos=new THREE.Vector3();
function animateCamera(dt){
 const target=new THREE.Vector3(state.x,1.56,state.z);
 // Camera yaw is freely controlled: dragging the screen orbits the hero.
 camPos.set(state.x+Math.sin(cameraYaw)*Math.cos(cameraPitch)*cameraDistance,
            1.56+Math.sin(cameraPitch)*cameraDistance,
            state.z+Math.cos(cameraYaw)*Math.cos(cameraPitch)*cameraDistance);
 camera.position.lerp(camPos,Math.min(1,dt*8));
 camFocus.lerp(target,Math.min(1,dt*11));
 camera.lookAt(camFocus);
 // Keep sun shadows concentrated on the area around the player.
 sun.position.set(state.x-18,32,state.z+16);
 sun.target.position.set(state.x,0,state.z);
 sun.target.updateMatrixWorld();
}
let elapsed=0,last=performance.now(),saveClock=0;
function update(dt){
 elapsed+=dt;saveClock+=dt;cooldown=Math.max(0,cooldown-dt);attackTimer=Math.max(0,attackTimer-dt);
 approachMovement(dt);
 for(const e of enemies){
  if(e.dead>0){e.dead-=dt;if(e.dead<=0){e.dead=0;e.hp=48;e.mesh.visible=true;e.mesh.position.set(e.spawnX,0,e.spawnZ)}continue}
  e.hit=Math.max(0,e.hit-dt);
  const v=e.mesh.position,dist=Math.hypot(state.x-v.x,state.z-v.z);
  const home=Math.hypot(state.x-e.spawnX,state.z-e.spawnZ);
  let tx=e.spawnX,tz=e.spawnZ,speed=.65;
  if(dist<7&&home<10){tx=state.x;tz=state.z;speed=1.45}
  const deltaX=tx-v.x,deltaZ=tz-v.z,d=Math.hypot(deltaX,deltaZ);
  if(d>.9){
   const dx=deltaX/d*speed*dt,dz=deltaZ/d*speed*dt;
   if(clearAt(v.x+dx,v.z+dz,.3)){v.x+=dx;v.z+=dz}
   else if(clearAt(v.x+dx,v.z,.3))v.x+=dx;
   else if(clearAt(v.x,v.z+dz,.3))v.z+=dz;
   e.mesh.rotation.y=Math.atan2(dx,dz);
  }
  if(dist<1.32&&home<10&&e.hit===0){
   state.hp-=8;e.hit=1.3;
   if(state.hp<=0){state.hp=100+(state.level-1)*15;state.x=initial.x;state.z=initial.z;clearInput();msg("Ты очнулся в Тихом Приюте")}
  }
  e.bar.visible=dist<6||e.hp<48;
  e.fill.scale.x=e.hp/48;e.fill.position.x=-(1-e.hp/48)*.5;
  e.bar.lookAt(camera.position);
 }
 relicCrystal.rotation.y+=dt;
 relicCrystal.position.y=2.13+Math.sin(elapsed*2)*.2;
 elderMark.group.position.y=3.55+Math.sin(elapsed*2.4)*.12;
 hud();
 if(saveClock>8){saveClock=0;save()}
}
function frame(t){
 const dt=Math.min((t-last)/1000,.05);last=t;
 if(!paused&&!dialog)update(dt);
 animateCamera(dt);
 renderer.render(scene,camera);
 requestAnimationFrame(frame);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.65))});
hud();animateCamera(1);requestAnimationFrame(frame);
$("loader").remove();
}catch(error){$("loadText").textContent="Ошибка запуска 3D-сцены: "+String(error.message||error);throw error}
</script></body></html>
