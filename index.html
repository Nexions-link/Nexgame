<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131a"><title>NexGame</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131a;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud,#hint{position:fixed;top:12px;background:#10131acb;padding:10px 13px;border-radius:12px;pointer-events:none;font-size:14px}#hud{left:12px}#hint{right:12px;text-align:right;color:#cbd2dc}#controls{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:5px}.btn,#attack{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;appearance:none;outline:none;border:1px solid #ffffff35;background:#222b36d9;color:white;cursor:pointer}.btn{border-radius:14px;font-size:25px}.btn.pressed{background:#526c89}#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:3}#right{grid-column:3;grid-row:2}#attack{position:fixed;right:22px;bottom:calc(34px + env(safe-area-inset-bottom));height:88px;width:88px;border-radius:50%;background:#a83b3bdc;font-weight:bold}#attack:active{background:#c65555}#pauseBtn{position:fixed;top:12px;right:12px;z-index:20;padding:11px 15px;border-radius:12px;border:1px solid #ffffff35;background:#222b36ed;color:white;font-size:16px;font-weight:700;touch-action:manipulation;-webkit-user-select:none;user-select:none}#pauseOverlay{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:#080b11aa;backdrop-filter:blur(3px);pointer-events:none}#pauseOverlay.visible{display:flex}#pauseOverlay span{font-size:32px;font-weight:800;color:white;text-shadow:0 2px 10px #000}#hint{top:65px}@media(max-width:500px){#hint{font-size:11px;max-width:145px}}
</style></head><body>
<canvas id="game"></canvas><div id="hud">❤️ <span id="hp">100</span> &nbsp; ⭐ Ур. <span id="level">1</span> &nbsp; ✨ <span id="xp">0</span>/100</div><div id="hint">NexGame · 0.1.2<br>WASD / стрелки · Пробел</div>
<button id="pauseBtn" aria-label="Пауза" aria-pressed="false">⏸ Пауза</button><div id="pauseOverlay"><span>ПАУЗА</span></div><div id="controls"><button class="btn" id="up" aria-label="Вверх">▲</button><button class="btn" id="left" aria-label="Влево">◀</button><button class="btn" id="down" aria-label="Вниз">▼</button><button class="btn" id="right" aria-label="Вправо">▶</button></div><button id="attack">АТАКА</button>
<script>
"use strict";
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d"),keys=new Set(),touchDirections=new Map();
const player={x:1500,y:1500,r:25,speed:220,hp:100,xp:0,level:1,cooldown:0,flash:0};
let paused=false;const pauseBtn=document.getElementById("pauseBtn"),pauseOverlay=document.getElementById("pauseOverlay");function togglePause(){paused=!paused;clearControls();pauseBtn.textContent=paused?"▶ Продолжить":"⏸ Пауза";pauseBtn.setAttribute("aria-pressed",String(paused));pauseOverlay.classList.toggle("visible",paused)}pauseBtn.addEventListener("click",togglePause);const world={w:3000,h:3000};let cameraX=0,cameraY=0,last=performance.now(),vw=innerWidth,vh=innerHeight;
const enemies=[{x:1800,y:1330,hp:40,speed:55},{x:1150,y:1600,hp:40,speed:48},{x:1600,y:1830,hp:40,speed:62}];
function resize(){vw=innerWidth;vh=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(vw*d);canvas.height=Math.round(vh*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener("resize",resize);resize();
function clearControls(){keys.clear();touchDirections.clear();document.querySelectorAll(".btn").forEach(b=>b.classList.remove("pressed"))}
addEventListener("blur",clearControls);document.addEventListener("visibilitychange",()=>{if(document.hidden)clearControls()});addEventListener("pagehide",clearControls);
for(const [id,direction] of [["up","up"],["down","down"],["left","left"],["right","right"]]){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touchDirections.set(e.pointerId,direction);b.classList.add("pressed")});
 const release=e=>{e.preventDefault();touchDirections.delete(e.pointerId);if(![...touchDirections.values()].includes(direction))b.classList.remove("pressed")};
 b.addEventListener("pointerup",release);b.addEventListener("pointercancel",release);b.addEventListener("lostpointercapture",release);
 b.addEventListener("contextmenu",e=>e.preventDefault());
}
document.addEventListener("selectstart",e=>{if(e.target.closest("button"))e.preventDefault()});
document.getElementById("attack").addEventListener("pointerdown",e=>{e.preventDefault();attack()});
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();keys.add(k);if(k==="escape"&&!e.repeat)togglePause();if(k===" "&&!paused)attack()});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function down(k,t){return keys.has(k)||[...touchDirections.values()].includes(t)}
function attack(){if(paused||player.cooldown>0)return;player.cooldown=.35;player.flash=.13;for(const enemy of enemies){if(Math.hypot(enemy.x-player.x,enemy.y-player.y)<78){enemy.hp-=20;if(enemy.hp<=0){player.xp+=35;enemy.hp=40;enemy.x=100+Math.random()*2800;enemy.y=100+Math.random()*2800}}}if(player.xp>=100){player.xp-=100;player.level++;player.hp=100}}
function update(dt){let x=Number(down("d","right")||keys.has("arrowright"))-Number(down("a","left")||keys.has("arrowleft"));let y=Number(down("s","down")||keys.has("arrowdown"))-Number(down("w","up")||keys.has("arrowup"));if(x||y){const len=Math.hypot(x,y);player.x=Math.max(player.r,Math.min(world.w-player.r,player.x+x/len*player.speed*dt));player.y=Math.max(player.r,Math.min(world.h-player.r,player.y+y/len*player.speed*dt))}player.cooldown=Math.max(0,player.cooldown-dt);player.flash=Math.max(0,player.flash-dt);
for(const e of enemies){const dx=player.x-e.x,dy=player.y-e.y,dist=Math.hypot(dx,dy);if(dist>42){e.x+=dx/dist*e.speed*dt;e.y+=dy/dist*e.speed*dt}e.hit=(e.hit||0)-dt;if(dist<43&&e.hit<=0){player.hp-=8;e.hit=.8;if(player.hp<=0){player.hp=100;player.x=1500;player.y=1500}}}
cameraX=Math.max(0,Math.min(Math.max(0,world.w-vw),player.x-vw/2));cameraY=Math.max(0,Math.min(Math.max(0,world.h-vh),player.y-vh/2));document.getElementById("hp").textContent=player.hp;document.getElementById("level").textContent=player.level;document.getElementById("xp").textContent=player.xp}
function draw(){ctx.clearRect(0,0,vw,vh);ctx.save();ctx.translate(-cameraX,-cameraY);ctx.fillStyle="#233624";ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle="#ffffff0b";for(let x=0;x<=world.w;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<=world.h;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
for(let x=150;x<world.w;x+=260)for(let y=150;y<world.h;y+=310){ctx.fillStyle="#132018";ctx.fillRect(x-4,y+12,8,25);ctx.fillStyle="#162b1a";ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill()}
for(const e of enemies){ctx.fillStyle="#b84a4a";ctx.beginPath();ctx.arc(e.x,e.y,24,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.fillRect(e.x-18,e.y-35,36,5);ctx.fillStyle="#65c466";ctx.fillRect(e.x-18,e.y-35,36*e.hp/40,5)}
ctx.fillStyle="#5b8cff";ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(player.x+9,player.y-7,4,0,Math.PI*2);ctx.fill();if(player.flash>0){ctx.globalAlpha=player.flash/.13;ctx.strokeStyle="white";ctx.lineWidth=4;ctx.beginPath();ctx.arc(player.x,player.y,68,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}ctx.restore()}
function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;if(!paused)update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
