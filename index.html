<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>NexGame · Modern 2.5D 0.4</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#attack{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;border:2px solid #cc8777b3;background:radial-gradient(circle at 35% 25%,#e47e6a,#a4494e);color:#ffecd9;font-weight:800;font-size:15px;z-index:11;box-shadow:0 5px 19px #000a}
#interact{position:fixed;right:28px;bottom:calc(130px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:2px solid #d1b678b3;background:radial-gradient(circle at 30% 20%,#e6bc7d,#9c7754);color:#ffedc1;font-size:13px;font-weight:750;z-index:11;display:none;box-shadow:0 5px 15px #000a}
#toast{position:fixed;top:33%;left:50%;transform:translateX(-50%);padding:11px 18px;background:#171823eb;border:1px solid #a98b59;border-radius:9px;color:#ffe2a9;font-size:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;z-index:24;max-width:88vw}
#toast.visible{opacity:1}

#pauseCard{width:min(345px,calc(100vw - 36px));padding:24px;border:1px solid #88a6a0;border-radius:16px;background:linear-gradient(#35505b,#1e343f);box-shadow:0 15px 45px #000d;pointer-events:auto;text-align:center}
#pauseCard h2{margin:0 0 12px;font:30px Georgia,serif;color:#eed8ac}
#pauseCard p{margin:4px 0 17px;color:#cfc2b2;font-size:14px;line-height:1.5}
.pauseAction{display:block;width:100%;min-height:46px;margin-top:10px;padding:10px 13px;border-radius:9px;border:1px solid #a08966;background:#423c33;color:#fff0d1;font-weight:700}
.pauseAction.danger{border-color:#ab6462;background:#542d31;color:#ffe1dc}
.pauseAction.secondary{border-color:#5e5961;background:#25262c;color:#d4c9bc}

#dialogShade.visible{display:flex}
#dialog{width:min(460px,100%);max-height:85dvh;overflow:auto;border:1px solid #9bafae;border-radius:15px;background:linear-gradient(#344c59,#1a303c);padding:22px;box-shadow:0 15px 55px #000e}
#dialog h2{margin:0 0 6px;font:25px Georgia,serif;color:#edd29c}
#dialog .subtitle{margin:0 0 16px;color:#afa5a0;font-size:12px}

#dialog .choice{display:block;width:100%;margin-top:9px;min-height:42px;border:1px solid #8ea8a8;border-radius:8px;background:#345562;color:#ffe4b4;text-align:left;padding:10px 12px;font-weight:650}
#dialog .choice.secondary{background:#23252b;color:#d4c9b9;border-color:#5d5860}
#dialog .item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff18;font-size:14px}
#dialog .item:last-child{border-bottom:0}
#dialog small{color:#b1a593}
@media(max-width:680px){#area{top:calc(93px + env(safe-area-inset-top));font-size:12px}#hud{min-width:166px;padding:8px 10px}#questTracker{top:calc(137px + env(safe-area-inset-top));max-width:min(215px,62vw)}#questTracker strong{font-size:13px}#questTracker span{font-size:11px}}
@media(max-height:620px){#controls{width:126px;height:126px;left:10px;bottom:calc(10px + env(safe-area-inset-bottom))}#joystickKnob{left:30px;top:30px}#attack{width:74px;height:74px;bottom:calc(10px + env(safe-area-inset-bottom))}#interact{width:65px;height:65px;bottom:calc(92px + env(safe-area-inset-bottom))}#questTracker{top:calc(112px + env(safe-area-inset-top))}}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><div id="heroName">Странник <span id="level">1</span> ур.</div><div id="heroSub">Воин · <span id="gold">0</span> <span style="color:#e9b958">●</span></div><div class="bar"><span id="healthFill" style="width:100%"></span></div><div id="healthLabel">Здоровье: <span id="hp">100</span> / <span id="maxHp">100</span></div><div class="bar"><span id="xpFill" style="width:0%"></span></div><div id="xpLabel">Опыт: <span id="xp">0</span> / <span id="xpNeed">100</span></div></div>
<div id="area">☽ Сумеречная долина</div>

<div id="topActions"><button id="pauseBtn" class="topBtn">⏸ Пауза</button><button id="bagBtn" class="topBtn">🎒 Рюкзак</button></div>
<div id="pauseOverlay">
 <div id="pauseCard">
  <div id="pauseMenu">
   <h2>ПАУЗА</h2>
   <p>Тестовая версия NexGame RPG</p>
   <button id="resumeBtn" class="pauseAction">▶ Продолжить игру</button>
   <button id="resetBtn" class="pauseAction danger">↺ Сбросить прогресс</button>
  </div>
  <div id="resetConfirm" hidden>
   <h2>Начать сначала?</h2>
   <p>Уровень, золото, инвентарь и все задания будут сброшены. Отменить это действие нельзя.</p>
   <button id="confirmResetBtn" class="pauseAction danger">Да, сбросить весь прогресс</button>
   <button id="cancelResetBtn" class="pauseAction secondary">Нет, оставить как есть</button>
  </div>
 </div>
</div>
<div id="controls" aria-label="Виртуальный джойстик"><div id="joystickBase"></div><div id="joystickKnob"></div></div>
<button id="interact">✦<br>Говорить</button><button id="attack">⚔<br>АТАКА</button>
<div id="toast" role="status"></div>
<div id="dialogShade"><section id="dialog" role="dialog" aria-modal="true"><h2 id="dialogTitle"></h2><div id="dialogSub" class="subtitle"></div><div id="dialogBody"></div><div id="dialogChoices"></div></section></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d"),keys=new Set();
const TW=76,TH=38,WORLD=27,START_HP=100,SCREEN_SPEED=124;
const joystick={pointer:null,x:0,y:0},stick=$("controls"),knob=$("joystickKnob");
const player={x:0,y:0,hp:100,maxHp:100,level:1,xp:0,gold:0,potions:2,flash:0,cooldown:0,facing:1,walk:0};
let quest=0,kills=0,relic=false,paused=false,dialogOpen=false,last=performance.now(),vw=innerWidth,vh=innerHeight,cameraX=0,cameraY=0,elapsed=0,toastUntil=0;
const SAVE_KEY="nexgame-rpg-v040",LEGACY_SAVE_KEY="nexgame-rpg-v030";
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({x:player.x,y:player.y,hp:player.hp,level:player.level,xp:player.xp,gold:player.gold,potions:player.potions,quest,kills,relic}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||localStorage.getItem(LEGACY_SAVE_KEY));if(!d)return;for(const k of ["x","y","hp","level","xp","gold","potions"]){if(Number.isFinite(d[k]))player[k]=d[k]}quest=Math.max(0,Math.min(6,d.quest|0));kills=Math.max(0,Math.min(3,d.kills|0));relic=!!d.relic;player.x=Math.max(-WORLD,Math.min(WORLD,player.x));player.y=Math.max(-WORLD,Math.min(WORLD,player.y));player.level=Math.max(1,player.level);player.maxHp=START_HP+(player.level-1)*15;player.hp=Math.max(1,Math.min(player.maxHp,player.hp))}catch(e){}}
load();save();addEventListener("pagehide",save);
function hash(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2}}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
const npc=[
{x:1,y:-1,name:"Староста Эйрин",type:"elder"},
{x:-2,y:2,name:"Торговка Мира",type:"merchant"}
];
const relicSpot={x:12,y:-10};
const houses=[{x:-4,y:-3,type:"house"},{x:4,y:-4,type:"house"},{x:-4,y:4,type:"house"}];
const props=[];
for(let y=-WORLD;y<=WORLD;y++)for(let x=-WORLD;x<=WORLD;x++){const h=hash(x,y),r=Math.hypot(x,y);if(r>5.2&&h>.87&&Math.hypot(x-relicSpot.x,y-relicSpot.y)>2.3){props.push({x,y,type:h>.975?"ruin":h>.933?"tree":h>.9?"rock":"dead"})}}
const enemies=[
{x:7,y:5,sx:7,sy:5,hp:48,maxHp:48,speed:.85,hit:0,dead:0,seed:1},
{x:9,y:2,sx:9,sy:2,hp:48,maxHp:48,speed:.82,hit:0,dead:0,seed:2},
{x:6,y:-5,sx:6,sy:-5,hp:48,maxHp:48,speed:.8,hit:0,dead:0,seed:3},
{x:11,y:6,sx:11,sy:6,hp:48,maxHp:48,speed:.82,hit:0,dead:0,seed:4},
{x:13,y:-6,sx:13,sy:-6,hp:48,maxHp:48,speed:.84,hit:0,dead:0,seed:5},
{x:-8,y:9,sx:-8,sy:9,hp:48,maxHp:48,speed:.8,hit:0,dead:0,seed:6}
];
function resize(){vw=innerWidth;vh=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(vw*d);canvas.height=Math.round(vh*d);ctx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",resize);resize();
function resetJoystick(){joystick.pointer=null;joystick.x=0;joystick.y=0;knob.style.transform="translate(0px,0px)"}
function clearControls(){keys.clear();resetJoystick()}
addEventListener("blur",clearControls);document.addEventListener("visibilitychange",()=>{if(document.hidden){clearControls();save()}});addEventListener("pagehide",clearControls);
function moveJoystick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy),radius=r.width*.29,scale=dist>radius?radius/dist:1;const px=dx*scale,py=dy*scale;knob.style.transform="translate("+px+"px,"+py+"px)";joystick.x=dist<7?0:px/radius;joystick.y=dist<7?0:py/radius}
stick.addEventListener("pointerdown",e=>{if(paused||dialogOpen||joystick.pointer!==null)return;e.preventDefault();joystick.pointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveJoystick(e)});
stick.addEventListener("pointermove",e=>{if(e.pointerId!==joystick.pointer)return;e.preventDefault();moveJoystick(e)});
function releaseJoystick(e){if(e.pointerId===joystick.pointer){e.preventDefault();resetJoystick()}}
stick.addEventListener("pointerup",releaseJoystick);stick.addEventListener("pointercancel",releaseJoystick);stick.addEventListener("lostpointercapture",releaseJoystick);stick.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("selectstart",e=>{if(e.target.closest("button"))e.preventDefault()});
function togglePause(){
 if(dialogOpen)return;
 paused=!paused;
 clearControls();
 $("pauseBtn").textContent=paused?"▶ Продолжить":"⏸ Пауза";
 $("pauseOverlay").classList.toggle("visible",paused);
 $("pauseMenu").hidden=false;
 $("resetConfirm").hidden=true;
 save();
}
function resetTestWorld(){
 if(!paused)return;
 clearControls();
 Object.assign(player,{x:0,y:0,hp:100,maxHp:100,level:1,xp:0,gold:0,potions:2,flash:0,cooldown:0,facing:1,walk:0});
 quest=0;kills=0;relic=false;elapsed=0;
 for(const e of enemies){
  e.x=e.sx;e.y=e.sy;e.hp=e.maxHp;e.hit=0;e.hitFlash=0;e.dead=0;
 }
 const p=iso(player.x,player.y);
 cameraX=p.x-vw/2;cameraY=p.y-vh*.51;
 toastUntil=0;$("toast").classList.remove("visible");
 paused=false;
 $("pauseBtn").textContent="⏸ Пауза";
 $("pauseOverlay").classList.remove("visible");
 $("pauseMenu").hidden=false;
 $("resetConfirm").hidden=true;
 refreshHUD();
 try{localStorage.removeItem(SAVE_KEY)}catch(e){}
 save();
 toast("Мир сброшен — можно проходить задания заново!");
}
$("pauseBtn").addEventListener("click",togglePause);
$("resumeBtn").addEventListener("click",togglePause);
$("resetBtn").addEventListener("click",()=>{if(!paused)return;$("pauseMenu").hidden=true;$("resetConfirm").hidden=false});
$("cancelResetBtn").addEventListener("click",()=>{$("resetConfirm").hidden=true;$("pauseMenu").hidden=false});
$("confirmResetBtn").addEventListener("click",resetTestWorld);
$("attack").addEventListener("pointerdown",e=>{e.preventDefault();attack()});
$("interact").addEventListener("click",interact);
$("bagBtn").addEventListener("click",showBag);
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();if(k==="escape"&&!e.repeat){if(dialogOpen)closeDialog();else togglePause();return}if(k==="i"&&!e.repeat){showBag();return}if(k==="e"&&!e.repeat)interact();if(k===" "&&!e.repeat)attack();keys.add(k)});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function toast(message){$("toast").textContent=message;$("toast").classList.add("visible");toastUntil=performance.now()+2100}
function choice(label,fn,secondary=false){const b=document.createElement("button");b.className="choice"+(secondary?" secondary":"");b.textContent=label;b.addEventListener("click",fn);$("dialogChoices").appendChild(b)}
function showDialog(title,sub,paragraphs){clearControls();dialogOpen=true;$("dialogTitle").textContent=title;$("dialogSub").textContent=sub;$("dialogBody").replaceChildren();$("dialogChoices").replaceChildren();for(const line of paragraphs){const p=document.createElement("p");p.textContent=line;$("dialogBody").appendChild(p)}$("dialogShade").classList.add("visible")}
function closeDialog(){dialogOpen=false;$("dialogShade").classList.remove("visible");save()}
function showBag(){if(paused)return;if(dialogOpen){closeDialog();return}showDialog("Рюкзак странника","Инвентарь · "+player.gold+" золотых",["Потёртый меч — оружие воина.","Плащ странника — лёгкая походная одежда.",relic?"Древняя печать — находка из руин.":"Здесь появятся найденные предметы."]);choice("🧪 Зелье лечения × "+player.potions+" (+40 HP)",()=>{if(player.potions<1){toast("Зелий больше нет");return}if(player.hp>=player.maxHp){toast("Здоровье уже полное");return}player.potions--;player.hp=Math.min(player.maxHp,player.hp+40);closeDialog();toast("Здоровье восстановлено");save()});choice("Закрыть",closeDialog,true)}
function levelXp(){return 100+(player.level-1)*45}
function earnXp(amount){player.xp+=amount;while(player.xp>=levelXp()){player.xp-=levelXp();player.level++;player.maxHp=START_HP+(player.level-1)*15;player.hp=player.maxHp;toast("Новый уровень! "+player.level)}}
function nearbyNpc(){return npc.find(n=>distance(player,n)<2.1)}
function nearRelic(){return quest===4&&distance(player,relicSpot)<1.7}
function interact(){if(paused||dialogOpen)return;const n=nearbyNpc();if(n){if(n.type==="elder")talkElder();else talkMerchant();return}if(nearRelic()){relic=true;quest=5;save();toast("Получена древняя печать!");return}toast("Рядом не с кем поговорить")}
function talkElder(){
if(quest===0){showDialog("Староста Эйрин","Деревня Тихий Приют · Задание",["Добро пожаловать в Сумеречную долину, странник. Последние дни на окраине рыщут одичавшие волки.","Поможешь защитить дорогу? Победи трёх волков за восточными воротами."]);choice("Принять: Волки у дороги",()=>{quest=1;kills=0;closeDialog();toast("Новое задание: Волки у дороги");save()});choice("Пока не готов",closeDialog,true)}
else if(quest===1){showDialog("Староста Эйрин","Волки у дороги",["Дорога ещё опасна. Победи трёх волков к востоку от деревни.","Прогресс: "+kills+" из 3."]);choice("Я вернусь",closeDialog)}
else if(quest===2){showDialog("Староста Эйрин","Волки у дороги · Выполнено",["Спасибо! Ты сделал путь безопаснее. Вот обещанная награда."]);choice("Забрать 25 золотых и 80 опыта",()=>{quest=3;player.gold+=25;earnXp(80);closeDialog();toast("Задание выполнено! +25 золота, +80 опыта");save()})}
else if(quest===3){showDialog("Староста Эйрин","Новое задание · Старая печать",["В старых руинах на востоке хранилась каменная печать. Отправляйся к разбитому алтарю и принеси её мне.","Следуй к золотой метке в дальнем восточном краю долины."]);choice("Принять: Старая печать",()=>{quest=4;closeDialog();toast("Новое задание: Старая печать");save()});choice("Позже",closeDialog,true)}
else if(quest===4){showDialog("Староста Эйрин","Старая печать",["Поищи печать у разрушенного алтаря к востоку от деревни."]);choice("Отправляюсь",closeDialog)}
else if(quest===5){showDialog("Староста Эйрин","Старая печать · Выполнено",["Ты нашёл её! В этих руинах скрывается история долины. Мы ещё обязательно узнаем её."]);choice("Отдать печать: 40 золота и 110 опыта",()=>{quest=6;relic=false;player.gold+=40;earnXp(110);closeDialog();toast("Задание выполнено! +40 золота, +110 опыта");save()})}
else{showDialog("Староста Эйрин","Тихий Приют",["Покой долины ненадёжен. Но сегодня здесь есть кому её защитить.","Это конец первых сюжетных заданий. Мы продолжим историю в следующих обновлениях."]);choice("До встречи",closeDialog)}
}
function talkMerchant(){showDialog("Торговка Мира","Деревенские товары",["Путь опасен, странник. У меня есть лечебные настои.","Золото: "+player.gold+"."]);choice("Купить зелье лечения — 10 золотых",()=>{if(player.gold<10){toast("Недостаточно золота");return}player.gold-=10;player.potions++;closeDialog();toast("Куплено зелье лечения");save()});choice("До встречи",closeDialog,true)}
function attack(){if(paused||dialogOpen||player.cooldown>0)return;player.cooldown=.48;player.flash=.2;let chosen=null,dist=2.0;for(const e of enemies){if(e.dead>0)continue;const d=distance(player,e);if(d<dist){chosen=e;dist=d}}if(!chosen)return;chosen.hp-=24;chosen.hitFlash=.15;if(chosen.hp<=0){chosen.dead=23;chosen.hp=0;player.gold+=3;earnXp(18);if(quest===1){kills=Math.min(3,kills+1);if(kills===3){quest=2;toast("Волки побеждены! Вернись к Эйрин")}}save()}}
function refreshHUD(){const hp=Math.max(0,Math.round(player.hp));$("hp").textContent=hp;$("maxHp").textContent=player.maxHp;$("level").textContent=player.level;$("gold").textContent=player.gold;$("xp").textContent=player.xp;$("xpNeed").textContent=levelXp();$("healthFill").style.width=100*player.hp/player.maxHp+"%";$("xpFill").style.width=100*player.xp/levelXp()+"%";
let title="",msg="";if(quest===0){title="Начало пути";msg="Поговорите со старостой Эйрин (золотой знак)."}
if(quest===1){title="Волки у дороги";msg="Победите волков: "+kills+"/3 · на востоке"}
if(quest===2){title="Волки у дороги";msg="Вернитесь к старосте за наградой."}
if(quest===3){title="Новое задание";msg="Поговорите со старостой Эйрин."}
if(quest===4){title="Старая печать";msg="Найдите печать в восточных руинах."}
if(quest===5){title="Старая печать";msg="Отнесите печать старосте Эйрин."}
if(quest===6){title="Долина ждёт";msg="Исследуйте мир. Продолжение истории впереди."}
$("questTitle").textContent=title;$("questText").textContent=msg;
const n=nearbyNpc(),canRelic=nearRelic();$("interact").style.display=!paused&&!dialogOpen&&(!!n||canRelic)?"block":"none";$("interact").innerHTML=canRelic?"✦<br>Взять":"✦<br>Говорить";
$("area").textContent=Math.hypot(player.x,player.y)<5.3?"☽ Деревня Тихий Приют":Math.hypot(player.x-relicSpot.x,player.y-relicSpot.y)<3.5?"☽ Забытые руины":"☽ Сумеречная долина"}
function update(dt){elapsed+=dt;const kx=Number(keys.has("d")||keys.has("arrowright"))-Number(keys.has("a")||keys.has("arrowleft")),ky=Number(keys.has("s")||keys.has("arrowdown"))-Number(keys.has("w")||keys.has("arrowup"));let vx=joystick.x+kx,vy=joystick.y+ky;const v=Math.hypot(vx,vy);if(v>1){vx/=v;vy/=v}if(v>.02){const dx=(vx/TW+vy/TH)*SCREEN_SPEED*dt,dy=(vy/TH-vx/TW)*SCREEN_SPEED*dt;player.x=Math.max(-WORLD+.5,Math.min(WORLD-.5,player.x+dx));player.y=Math.max(-WORLD+.5,Math.min(WORLD-.5,player.y+dy));player.facing=vx>=0?1:-1;player.walk+=v*dt*11}
player.cooldown=Math.max(0,player.cooldown-dt);player.flash=Math.max(0,player.flash-dt);
for(const e of enemies){if(e.dead>0){e.dead-=dt;if(e.dead<=0){e.dead=0;e.hp=e.maxHp;e.x=e.sx;e.y=e.sy}continue}e.hit-=dt;e.hitFlash=Math.max(0,(e.hitFlash||0)-dt);const pd=distance(player,e),home=Math.hypot(player.x-e.sx,player.y-e.sy);let targetX=e.sx,targetY=e.sy,spd=.44;if(pd<4.5&&home<6.0){targetX=player.x;targetY=player.y;spd=e.speed}const dx=targetX-e.x,dy=targetY-e.y,dist=Math.hypot(dx,dy);if(dist>.8){e.x+=dx/dist*spd*dt;e.y+=dy/dist*spd*dt}if(pd<.8&&home<6&&e.hit<=0){player.hp-=9;e.hit=1.15;if(player.hp<=0){player.hp=player.maxHp;player.x=0;player.y=0;resetJoystick();toast("Ты очнулся в Тихом Приюте")}}}
const p=iso(player.x,player.y);cameraX=p.x-vw/2;cameraY=p.y-vh*.51;
refreshHUD();if(toastUntil&&performance.now()>toastUntil){$("toast").classList.remove("visible");toastUntil=0}}
function polygon(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function line(ax,ay,bx,by,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke()}
function radial(cx,cy,r,inner,outer){
 const g=ctx.createRadialGradient(cx-r*.2,cy-r*.3,Math.max(1,r*.03),cx,cy,r);
 g.addColorStop(0,inner);g.addColorStop(1,outer);return g;
}
function softShadow(x,y,rx,ry,a=.23){
 ctx.save();ctx.fillStyle="rgba(27,47,51,"+a+")";ctx.shadowColor="#203d45";ctx.shadowBlur=13;
 ctx.beginPath();ctx.ellipse(x+10,y+8,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
function leaf(x,y,rx,ry,c1,c2){
 ctx.save();ctx.fillStyle=radial(x-5,y-4,Math.max(rx,ry)*1.2,c1,c2);
 ctx.beginPath();ctx.ellipse(x,y,rx,ry,-.17,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#c9ecb733";ctx.lineWidth=1;ctx.beginPath();
 ctx.ellipse(x-3,y-3,rx*.77,ry*.7,-.17,Math.PI*1.1,Math.PI*1.82);ctx.stroke();ctx.restore();
}
function windowGlow(x,y){
 ctx.save();ctx.shadowColor="#ffdf92";ctx.shadowBlur=12;ctx.fillStyle="#ffdfa1";
 ctx.beginPath();ctx.ellipse(x,y,3.5,5,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
function plant(x,y,seed){
 const sw=(seed-.5)*8;
 line(x,y,x+sw-3,y-7,"#336d49",1.5);
 line(x,y,x+sw+4,y-9,"#4b8c52",1.4);
 if(seed>.83){ellipse(x+sw-3,y-9,2.2,2.2,"#e6ce80");ellipse(x+sw+3,y-10,1.7,1.7,"#f6f0c2")}
}
function drawProp(o){
 const p=iso(o.x,o.y),x=p.x,y=p.y;
 if(o.type==="rock"){
  softShadow(x,y,23,9,.26);
  polygon([[x-26,y-2],[x-12,y-23],[x+10,y-29],[x+26,y-8],[x+17,y+4],[x-13,y+5]],"#879899","#4b7271");
  polygon([[x-12,y-23],[x+10,y-29],[x+6,y-5],[x-15,y-5]],"#bcc4b8");
  polygon([[x+6,y-5],[x+10,y-29],[x+26,y-8],[x+17,y+4]],"#687e80");
  line(x-10,y-19,x,y-23,"#ffffff64",1);
  return;
 }
 if(o.type==="ruin"){
  softShadow(x,y,24,11,.3);
  polygon([[x-17,y],[x-17,y-46],[x+3,y-56],[x+3,y-10]],"#a2a49b","#516565");
  polygon([[x+3,y-10],[x+3,y-56],[x+20,y-46],[x+20,y+3]],"#6f8582","#516565");
  polygon([[x-17,y-46],[x+3,y-56],[x+20,y-46],[x,y-36]],"#d2c7af","#5b7471");
  polygon([[x-9,y-12],[x-9,y-33],[x+3,y-39],[x+3,y-18]],"#456d6c");
  return;
 }
 softShadow(x,y,29,11,.25);
 if(o.type==="dead"){
  line(x,y,x-3,y-58,"#73655b",8);
  line(x-3,y-44,x-24,y-74,"#897968",4);
  line(x-3,y-39,x+21,y-70,"#857267",4);
  line(x-5,y-57,x+8,y-91,"#837162",3);
  return;
 }
 line(x+1,y+1,x-2,y-65,"#685b46",13);
 line(x-3,y-33,x-21,y-68,"#71624c",5);
 line(x-1,y-40,x+18,y-76,"#756a53",5);
 leaf(x-25,y-78,30,22,"#83bd70","#427d59");
 leaf(x+19,y-79,33,27,"#95c882","#4b8965");
 leaf(x-8,y-112,37,29,"#b5d88c","#568e62");
 leaf(x+6,y-111,24,18,"#c4e3a0","#80b477");
 ellipse(x-14,y-124,10,4,"#d8ecb067");
}
function drawHouse(o){
 const p=iso(o.x,o.y),x=p.x,y=p.y;
 softShadow(x,y+15,81,24,.4);
 // Volumetric building with a visible front and side wall.
 polygon([[x-67,y-44],[x,y-10],[x,y+47],[x-67,y+13]],"#ead9ae","#978a75");
 polygon([[x,y-10],[x+67,y-44],[x+67,y+13],[x,y+47]],"#c9b89d","#8b8a76");
 line(x-62,y-38,x-62,y+10,"#f9e9bd66",3);
 line(x+60,y-37,x+60,y+10,"#9b8b6d",3);
 // Stone chimney set behind the roof planes.
 polygon([[x+21,y-74],[x+21,y-127],[x+37,y-118],[x+37,y-66]],"#d2bfaa","#887d73");
 polygon([[x+37,y-66],[x+37,y-118],[x+48,y-110],[x+48,y-59]],"#ac9c91","#766f69");
 polygon([[x+19,y-127],[x+36,y-137],[x+50,y-128],[x+33,y-118]],"#f1e0c5","#95837c");
 // Warm red-tiled elevated hip roof, with overhanging eaves.
 const west=o.x<0?"#d78e69":"#ce795d",east=o.x<0?"#b7705a":"#b06d62";
 polygon([[x,y-132],[x-80,y-53],[x,y-10]],west,"#875949");
 polygon([[x,y-132],[x,y-10],[x+80,y-53]],east,"#805647");
 polygon([[x-80,y-53],[x,y-10],[x-2,y-4],[x-86,y-49]],"#b46c56","#925c4f");
 polygon([[x,y-10],[x+80,y-53],[x+86,y-49],[x+2,y-4]],"#965d51","#785047");
 line(x,y-132,x-80,y-53,"#f2b88d",3);
 line(x,y-132,x+80,y-53,"#e0a182",3);
 // A framed entrance and turquoise glass windows.
 polygon([[x+18,y+10],[x+18,y-15],[x+45,y-28],[x+45,y-2]],"#745b4b","#f2dfb0");
 polygon([[x+22,y+9],[x+22,y-11],[x+40,y-20],[x+40,y-2]],"#65544b");
 ellipse(x+37,y-11,2,3,"#f9e6b1");
 polygon([[x-47,y-4],[x-47,y-26],[x-21,y-14],[x-21,y+8]],"#fff2cf","#ad9b7e");
 polygon([[x-42,y-4],[x-42,y-19],[x-26,y-12],[x-26,y+3]],"#81bec5");
 line(x-34,y-17,x-34,y+2,"#f4e4be",2);
 windowGlow(x-34,y-8);
 for(let i=0;i<4;i++)plant(x-48+i*13,y+20+i*4,.84+i*.04);
}
function drawRelic(){
 const p=iso(relicSpot.x,relicSpot.y),x=p.x,y=p.y;
 softShadow(x,y+7,52,18,.33);
 ellipse(x,y+5,49,16,"#81948c");ellipse(x,y-1,40,13,"#b1bcb0");
 polygon([[x-31,y],[x-31,y-22],[x-8,y-32],[x-8,y-7]],"#b5b7ab","#758c86");
 polygon([[x-8,y-7],[x-8,y-32],[x+27,y-17],[x+27,y+7]],"#899d95","#5b7b78");
 if(quest===4&&!relic){
  ctx.save();ctx.shadowColor="#78f2e6";ctx.shadowBlur=20;
  polygon([[x,y-58],[x-8,y-42],[x,y-20],[x+9,y-42]],"#75efe0","#429fa5");ctx.restore();
  ellipse(x-3,y-42,3,11,"#effff0bb");
 }
}
function questMarkerForElder(){
 if(quest===0||quest===3)return{text:"!",color:"#ffd35f",glow:true};
 if(quest===1||quest===4)return{text:"?",color:"#9c958c",glow:false};
 if(quest===2||quest===5)return{text:"?",color:"#ffd35f",glow:true};
 return null;
}
function drawNpc(n){
 const p=iso(n.x,n.y),x=p.x,y=p.y;
 softShadow(x,y+1,19,7,.22);
 const elder=n.type==="elder";
 const robe=elder?"#7b8fc0":"#dd9c75",shade=elder?"#4e638f":"#ab745e";
 // Boots and shaded robes for small stylized human characters.
 ellipse(x-7,y-5,5,4,"#655b62");ellipse(x+7,y-5,5,4,"#655b62");
 polygon([[x-14,y-5],[x-13,y-34],[x,y-47],[x+14,y-34],[x+16,y-5]],shade,"#405168");
 polygon([[x-10,y-6],[x-7,y-37],[x,y-44],[x+5,y-34],[x+9,y-5]],robe);
 ellipse(x,y-37,8,10,radial(x-4,y-41,15,"#f9dcc2","#a77f6d"));
 leaf(x,y-49,10,5,elder?"#f2e5c5":"#785849",elder?"#bba993":"#664a43");
 if(elder){line(x+13,y-27,x+23,y-1,"#b8a17b",3);ellipse(x+13,y-29,4,4,"#c9aa82")}
 const marker=elder?questMarkerForElder():null;
 if(marker){
  ctx.save();ctx.textAlign="center";ctx.font="bold 28px Georgia";
  if(marker.glow){ctx.shadowColor="#fff0a6";ctx.shadowBlur=12}
  ctx.fillStyle=marker.color;ctx.fillText(marker.text,x,y-68);ctx.restore();
 }
 if(distance(player,n)<2.1){
  ctx.save();ctx.textAlign="center";ctx.font="bold 12px system-ui";ctx.strokeStyle="#2a424c";ctx.lineWidth=3;
  ctx.strokeText(n.name,x,y-87);ctx.fillStyle="#fff8e7";ctx.fillText(n.name,x,y-87);ctx.restore();
 }
}
function drawEnemy(e){
 if(e.dead>0)return;
 const p=iso(e.x,e.y),x=p.x,y=p.y;
 softShadow(x,y+2,23,8,.22);
 const hurt=(e.hitFlash||0)>0;
 // Four legs, a raised wolf's body, pointed ears and muzzle.
 for(const lx of [-11,8])line(x+lx,y-10,x+lx-3,y+3,hurt?"#cb837d":"#655e66",5.5);
 ellipse(x-2,y-22,24,13,radial(x-9,y-28,27,hurt?"#d9a09a":"#aaa2a0","#566578"));
 ellipse(x+16,y-27,14,12,radial(x+12,y-33,18,"#b3a69c","#53626f"));
 polygon([[x+8,y-36],[x+11,y-55],[x+20,y-38]],"#647583");
 polygon([[x+20,y-37],[x+33,y-55],[x+34,y-29]],"#586d7c");
 ellipse(x+29,y-20,12,7,"#aaa4a0");ellipse(x+34,y-22,2.5,2.5,"#34373f");
 ellipse(x+20,y-30,2,2,"#f5e19a");
 line(x-24,y-24,x-37,y-34,"#7e8c91",5);
 if(e.hp<e.maxHp||distance(player,e)<3){
  ctx.fillStyle="#243a40";ctx.fillRect(x-23,y-62,46,5);
  ctx.fillStyle="#de6f6a";ctx.fillRect(x-23,y-62,46*e.hp/e.maxHp,5);
 }
}
function drawPlayer(){
 const p=iso(player.x,player.y),x=p.x,y=p.y;
 const step=Math.sin(player.walk)*2,fac=player.facing;
 softShadow(x,y+3,22,9,.25);
 // Animated boots, layered cape and metallic tunic.
 ellipse(x-8,y-5+(step>0?step:0),6,4,"#4c555d");
 ellipse(x+8,y-5+(step<0?-step:0),6,4,"#4c555d");
 polygon([[x-17,y-8],[x-18,y-42],[x-6,y-52],[x+15,y-40],[x+20,y-6]],"#526a85","#344f60");
 polygon([[x-10,y-8],[x-9,y-40],[x+3,y-46],[x+12,y-36],[x+12,y-7]],"#87a8b6","#536c88");
 polygon([[x-12,y-39],[x-19,y-30],[x-16,y-15],[x-9,y-18]],"#d2beac","#8c9999");
 polygon([[x+11,y-39],[x+20,y-32],[x+16,y-17],[x+9,y-20]],"#c7b3a4","#6f8a8f");
 ellipse(x,y-46+step*.23,9,11,radial(x-5,y-51,16,"#ffe0ba","#b88275"));
 leaf(x,y-55,10,6,"#6f5450","#493e45");
 polygon([[x-8,y-35],[x,y-44],[x+9,y-35],[x+7,y-17],[x-6,y-17]],"#507c8b","#365866");
 ellipse(x,y-34,3.3,3.3,"#f8d28e");
 line(x+15*fac,y-26,x+23*fac,y-10,"#b2c2cf",4);
 line(x+23*fac,y-10,x+29*fac,y-34,"#e6f0e9",3);
 if(player.flash>0){
  ctx.save();ctx.globalAlpha=player.flash/.2;ctx.strokeStyle="#f6d68c";
  ctx.lineWidth=5;ctx.shadowColor="#f6c66c";ctx.shadowBlur=12;
  ctx.beginPath();ctx.ellipse(x,y,64,26,0,0,Math.PI*2);ctx.stroke();ctx.restore();
 }
}
function drawGround(){
 const c=iso(player.x,player.y);
 for(let y=-WORLD;y<=WORLD;y++)for(let x=-WORLD;x<=WORLD;x++){
  const p=iso(x,y);
  if(Math.abs(p.x-c.x)>vw/2+TW||Math.abs(p.y-c.y)>vh/2+TH)continue;
  const h=hash(x,y),village=Math.hypot(x,y)<5.3;
  const road=(Math.abs(y-x*.18)<1.3&&x>0&&x<14)||Math.hypot(x-relicSpot.x,y-relicSpot.y)<2;
  const lake=Math.hypot(x+12,y+10)<3.5;
  let color;
  if(lake)color=h>.5?"#539dad":"#478d9f";
  else if(road)color=h>.5?"#bcac85":"#b5a480";
  else if(village)color=h>.5?"#83b890":"#7bac86";
  else color=h>.87?"#78a96c":h>.63?"#69a779":h>.31?"#75b184":"#70aa79";
  polygon([[p.x,p.y-TH/2],[p.x+TW/2,p.y],[p.x,p.y+TH/2],[p.x-TW/2,p.y]],color,road?"#a79a7b44":"#417d6530");
  if(lake){
   if(h>.72){line(p.x-11,p.y+3,p.x+6,p.y+3,"#b7edf087",1.2);line(p.x-5,p.y-4,p.x+9,p.y-4,"#b7edf071",1)}
  }else if(road){
   if(h>.75){ellipse(p.x-7,p.y+4,3,1.6,"#e5d7b199");ellipse(p.x+14,p.y-2,2,1,"#877b6599")}
  }else{
   if(h>.56)plant(p.x+(hash(x+7,y)*25-12),p.y+(hash(x,y+17)*13-7),h);
   if(h>.93)ellipse(p.x+7,p.y-4,4,2.4,"#b4cfa477");
  }
 }
}
function draw(){
 const bg=ctx.createLinearGradient(0,0,0,vh);
 bg.addColorStop(0,"#a6ced0");bg.addColorStop(1,"#d5e7c4");
 ctx.fillStyle=bg;ctx.fillRect(0,0,vw,vh);
 ctx.save();ctx.translate(-cameraX,-cameraY);drawGround();
 const center=iso(player.x,player.y);
 const inView=o=>{const p=iso(o.x,o.y);return Math.abs(p.x-center.x)<vw/2+120&&Math.abs(p.y-center.y)<vh/2+210};
 const drawables=[];
 for(const o of props)if(inView(o))drawables.push({z:o.x+o.y,draw:()=>drawProp(o)});
 for(const o of houses)if(inView(o))drawables.push({z:o.x+o.y,draw:()=>drawHouse(o)});
 for(const o of npc)if(inView(o))drawables.push({z:o.x+o.y,draw:()=>drawNpc(o)});
 for(const e of enemies)if(e.dead<=0&&inView(e))drawables.push({z:e.x+e.y,draw:()=>drawEnemy(e)});
 if(inView(relicSpot))drawables.push({z:relicSpot.x+relicSpot.y,draw:drawRelic});
 drawables.push({z:player.x+player.y,draw:drawPlayer});
 drawables.sort((a,b)=>a.z-b.z);
 for(const o of drawables)o.draw();
 ctx.restore();
 // Daylight gradient and soft, warm corners instead of Gothic near-black.
 const sun=ctx.createRadialGradient(vw*.82,vh*.18,15,vw*.82,vh*.18,Math.max(vw,vh)*.95);
 sun.addColorStop(0,"#fff8db20");sun.addColorStop(1,"#ffffff00");
 ctx.fillStyle=sun;ctx.fillRect(0,0,vw,vh);
 const vignette=ctx.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.25,vw/2,vh/2,Math.max(vw,vh)*.88);
 vignette.addColorStop(0,"#00000000");vignette.addColorStop(1,"#173b4544");
 ctx.fillStyle=vignette;ctx.fillRect(0,0,vw,vh);
}
function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;if(!paused&&!dialogOpen)update(dt);else refreshHUD();draw();requestAnimationFrame(frame)}
let lastSave=performance.now();function autosave(t){if(t-lastSave>6500){lastSave=t;save()}requestAnimationFrame(autosave)}
const p=iso(player.x,player.y);cameraX=p.x-innerWidth/2;cameraY=p.y-innerHeight*.51;refreshHUD();requestAnimationFrame(frame);requestAnimationFrame(autosave);
</script></body></html>
