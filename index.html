<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131a"><title>NexGame</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud,#hint{position:fixed;top:12px;background:#10131acb;padding:10px 13px;border-radius:12px;pointer-events:none;font-size:14px}#hud{left:12px}#hint{right:12px;text-align:right;color:#cbd2dc}#controls{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:5px}.btn,#attack{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;appearance:none;outline:none;border:1px solid #ffffff35;background:#25212bdc;color:white;cursor:pointer}.btn{border-radius:14px;font-size:25px}.btn.pressed{background:#526c89}#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:3}#right{grid-column:3;grid-row:2}#attack{position:fixed;right:22px;bottom:calc(34px + env(safe-area-inset-bottom));height:88px;width:88px;border-radius:50%;background:#862b35e8;font-weight:bold}#attack:active{background:#c65555}#pauseBtn{position:fixed;top:12px;right:12px;z-index:20;padding:11px 15px;border-radius:12px;border:1px solid #ffffff35;background:#222b36ed;color:white;font-size:16px;font-weight:700;touch-action:manipulation;-webkit-user-select:none;user-select:none}#pauseOverlay{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:#080b11aa;backdrop-filter:blur(3px);pointer-events:none}#pauseOverlay.visible{display:flex}#pauseOverlay span{font-size:32px;font-weight:800;color:white;text-shadow:0 2px 10px #000}#hint{top:65px}@media(max-width:500px){#hint{font-size:11px;max-width:145px}}
</style></head><body>
<canvas id="game"></canvas><div id="hud">❤️ <span id="hp">100</span> &nbsp; ⭐ Ур. <span id="level">1</span> &nbsp; ✨ <span id="xp">0</span>/100</div><div id="hint">NexGame · 0.2.1<br>WASD / стрелки · Пробел</div>
<button id="pauseBtn" aria-label="Пауза" aria-pressed="false">⏸ Пауза</button><div id="pauseOverlay"><span>ПАУЗА</span></div><div id="controls"><button class="btn" id="up" aria-label="Вверх">▲</button><button class="btn" id="left" aria-label="Влево">◀</button><button class="btn" id="down" aria-label="Вниз">▼</button><button class="btn" id="right" aria-label="Вправо">▶</button></div><button id="attack">АТАКА</button>
<script>
"use strict";
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d"),keys=new Set(),touchDirections=new Map();
const player={x:0,y:0,r:13,speed:3.2,hp:100,xp:0,level:1,cooldown:0,flash:0,facing:1};
let paused=false;const pauseBtn=document.getElementById("pauseBtn"),pauseOverlay=document.getElementById("pauseOverlay");
function togglePause(){paused=!paused;clearControls();pauseBtn.textContent=paused?"▶ Продолжить":"⏸ Пауза";pauseBtn.setAttribute("aria-pressed",String(paused));pauseOverlay.classList.toggle("visible",paused)}
pauseBtn.addEventListener("click",togglePause);
const world={w:46,h:46},TW=76,TH=38;
let cameraX=0,cameraY=0,last=performance.now(),vw=innerWidth,vh=innerHeight;
const enemies=[{x:5,y:3,hp:40,speed:.78,hit:0},{x:-4,y:6,hp:40,speed:.72,hit:0},{x:2,y:-6,hp:40,speed:.92,hit:0}];
const props=[];
function hash(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)}
for(let y=-22;y<=22;y++)for(let x=-22;x<=22;x++){const h=hash(x,y);if(Math.hypot(x,y)>3&&h>.87)props.push({x,y,type:h>.975?"ruin":h>.936?"tree":h>.905?"rock":"dead"})}
function iso(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2}}
function resize(){vw=innerWidth;vh=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(vw*d);canvas.height=Math.round(vh*d);ctx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",resize);resize();
function clearControls(){keys.clear();touchDirections.clear();document.querySelectorAll(".btn").forEach(b=>b.classList.remove("pressed"))}
addEventListener("blur",clearControls);document.addEventListener("visibilitychange",()=>{if(document.hidden)clearControls()});addEventListener("pagehide",clearControls);
for(const [id,direction] of [["up","up"],["down","down"],["left","left"],["right","right"]]){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touchDirections.set(e.pointerId,direction);b.classList.add("pressed")});
 const release=e=>{e.preventDefault();touchDirections.delete(e.pointerId);if(![...touchDirections.values()].includes(direction))b.classList.remove("pressed")};
 b.addEventListener("pointerup",release);b.addEventListener("pointercancel",release);b.addEventListener("lostpointercapture",release);
 b.addEventListener("contextmenu",e=>e.preventDefault());
}
document.addEventListener("selectstart",e=>{if(e.target.closest("button"))e.preventDefault()});
document.getElementById("attack").addEventListener("pointerdown",e=>{e.preventDefault();attack()});
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();keys.add(k);if(k==="escape"&&!e.repeat)togglePause();if(k===" "&&!paused)attack()});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function down(k,t){return keys.has(k)||[...touchDirections.values()].includes(t)}
function attack(){if(paused||player.cooldown>0)return;player.cooldown=.42;player.flash=.18;for(const e of enemies){if(Math.hypot(e.x-player.x,e.y-player.y)<1.85){e.hp-=20;if(e.hp<=0){player.xp+=35;e.hp=40;const angle=Math.random()*Math.PI*2;e.x=player.x+Math.cos(angle)*9;e.y=player.y+Math.sin(angle)*9}}}if(player.xp>=100){player.xp-=100;player.level++;player.hp=100}}
function update(dt){let x=Number(down("d","right")||keys.has("arrowright"))-Number(down("a","left")||keys.has("arrowleft"));let y=Number(down("s","down")||keys.has("arrowdown"))-Number(down("w","up")||keys.has("arrowup"));if(x||y){const len=Math.hypot(x,y);x/=len;y/=len;const screenX=x,screenY=y;const dx=(screenX*TW/2+screenY*TH/2)/(TW*TH/2),dy=(screenY*TH/2-screenX*TW/2)/(TW*TH/2);const screenSpeed=player.speed*TH/Math.SQRT2;player.x=Math.max(-22,Math.min(22,player.x+dx*screenSpeed*dt));player.y=Math.max(-22,Math.min(22,player.y+dy*screenSpeed*dt));player.facing=x>=0?1:-1}player.cooldown=Math.max(0,player.cooldown-dt);player.flash=Math.max(0,player.flash-dt);
for(const e of enemies){const dx=player.x-e.x,dy=player.y-e.y,dist=Math.hypot(dx,dy);if(dist>0.78){e.x+=dx/dist*e.speed*dt;e.y+=dy/dist*e.speed*dt}e.hit-=dt;if(dist<.85&&e.hit<=0){player.hp-=8;e.hit=.8;if(player.hp<=0){player.hp=100;player.x=0;player.y=0}}}
const p=iso(player.x,player.y);cameraX=p.x-vw/2;cameraY=p.y-vh*.49;
document.getElementById("hp").textContent=player.hp;document.getElementById("level").textContent=player.level;document.getElementById("xp").textContent=player.xp}
function polygon(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function drawProp(o){const p=iso(o.x,o.y),x=p.x,y=p.y;ellipse(x+9,y+6,24,10,"#03050677");if(o.type==="rock"){polygon([[x-20,y-2],[x-9,y-19],[x+12,y-23],[x+22,y-8],[x+15,y+5],[x-10,y+7]],"#363b42","#1d242c");polygon([[x-9,y-19],[x+12,y-23],[x+5,y-6],[x-15,y-3]],"#59616a");return}if(o.type==="ruin"){polygon([[x-16,y],[x-16,y-43],[x+4,y-55],[x+4,y-8]],"#393b40");polygon([[x+4,y-8],[x+4,y-55],[x+18,y-45],[x+18,y+1]],"#20252a");polygon([[x-16,y-43],[x+4,y-55],[x+18,y-45],[x-2,y-33]],"#666269");return}
ctx.strokeStyle=o.type==="tree"?"#201a1b":"#34292a";ctx.lineWidth=o.type==="tree"?10:5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y-48);ctx.stroke();for(const [dx,dy] of [[-20,-64],[20,-72],[-12,-92],[9,-108]]){ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-3,y-48);ctx.lineTo(x+dx,y+dy);ctx.stroke()}
if(o.type==="tree"){for(const [dx,dy,r] of [[-16,-71,24],[15,-76,28],[-4,-103,27]]){ellipse(x+dx,y+dy,r,r*.73,"#16271f");ellipse(x+dx-5,y+dy-6,r*.7,r*.5,"#26382b")}}}
function drawEnemy(e){const p=iso(e.x,e.y),x=p.x,y=p.y;ellipse(x,y+5,17,8,"#030407bb");polygon([[x-14,y-5],[x-12,y-28],[x,y-40],[x+13,y-25],[x+14,y-5]],"#612e39","#1d1119");ellipse(x,y-32,10,11,"#8d5b58");ellipse(x-4,y-34,2,2,"#ff8b52");ellipse(x+4,y-34,2,2,"#ff8b52");ctx.fillStyle="#130d12";ctx.fillRect(x-16,y-51,32,5);ctx.fillStyle="#bd5757";ctx.fillRect(x-16,y-51,32*e.hp/40,5)}
function drawPlayer(){const p=iso(player.x,player.y),x=p.x,y=p.y;ellipse(x,y+6,19,9,"#030407bb");polygon([[x-17,y-4],[x-13,y-34],[x,y-42],[x+14,y-31],[x+17,y-4]],"#3e536d","#141e2c");polygon([[x-10,y-33],[x,y-49],[x+10,y-33],[x+5,y-21],[x-6,y-21]],"#7b8495","#283246");ellipse(x,y-34,5,6,"#c7b3a0");ctx.strokeStyle="#aeb7c7";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+13,y-23);ctx.lineTo(x+24,y-9);ctx.stroke();if(player.flash>0){ctx.globalAlpha=player.flash/.18;ellipse(x,y,68,26,"#d9b17d33");ctx.strokeStyle="#e3a57d";ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x,y,68,26,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}}
function draw(){ctx.fillStyle="#0b1013";ctx.fillRect(0,0,vw,vh);ctx.save();ctx.translate(-cameraX,-cameraY);
const c=iso(player.x,player.y);for(let y=-23;y<=23;y++)for(let x=-23;x<=23;x++){const p=iso(x,y);if(Math.abs(p.x-c.x)>vw/2+TW||Math.abs(p.y-c.y)>vh/2+TH)continue;const h=hash(x,y),shade=h>.87?"#333139":h>.63?"#252d2c":h>.31?"#222927":"#1d2525";polygon([[p.x,p.y-TH/2],[p.x+TW/2,p.y],[p.x,p.y+TH/2],[p.x-TW/2,p.y]],shade,"#151d20");if(h>.7){ctx.strokeStyle="#47514466";ctx.beginPath();ctx.moveTo(p.x-5,p.y+2);ctx.lineTo(p.x-9,p.y-6);ctx.moveTo(p.x+4,p.y+5);ctx.lineTo(p.x+9,p.y-3);ctx.stroke()}}
const objects=props.filter(o=>{const p=iso(o.x,o.y);return Math.abs(p.x-c.x)<vw/2+110&&Math.abs(p.y-c.y)<vh/2+160}).map(o=>({depth:o.x+o.y,draw:()=>drawProp(o)}));for(const e of enemies)objects.push({depth:e.x+e.y,draw:()=>drawEnemy(e)});objects.push({depth:player.x+player.y,draw:drawPlayer});objects.sort((a,b)=>a.depth-b.depth);for(const o of objects)o.draw();
ctx.restore();const vignette=ctx.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.15,vw/2,vh/2,Math.max(vw,vh)*.7);vignette.addColorStop(0,"#00000000");vignette.addColorStop(1,"#050409bb");ctx.fillStyle=vignette;ctx.fillRect(0,0,vw,vh)}
function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;if(!paused)update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
